[build]
  command = "pnpm build"
  publish = "apps/dhg-lovable/dist"
  base = "/"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--version"
  PNPM_VERSION = "9.15.3"

[[plugins]]
  package = "@netlify/plugin-pnpm"

# Redirect configuration for main domain
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 