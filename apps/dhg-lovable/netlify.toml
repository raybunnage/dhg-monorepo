[build]
  base = "apps/dhg-lovable"
  command = "pnpm build"
  publish = "dist"

# Production environment (main branch)
[context.production]
  environment = { 
    NODE_ENV = "production",
    VITE_APP_ENV = "production",
    VITE_API_URL = "https://golden-snickerdoodle-c35f38.netlify.app/api",
    VITE_SUPABASE_URL = "https://jdksnfkupzywjdfefkyj.supabase.co",
    VITE_APP_URL = "https://golden-snickerdoodle-c35f38.netlify.app"
  }

# Staging environment (development branch)
[context.development]
  environment = { 
    NODE_ENV = "development",
    VITE_APP_ENV = "development",
    VITE_API_URL = "https://dev-api.dhg-hub.org",
    VITE_SUPABASE_URL = "https://jdksnfkupzywjdfefkyj.supabase.co",
    VITE_APP_URL = "https://dev.dhg-hub.org"
  }

# Preview environment (feature branches and PRs)
[context.branch-deploy]
  environment = { 
    NODE_ENV = "development",
    VITE_APP_ENV = "preview",
    VITE_API_URL = "https://preview-api.dhg-hub.org",
    VITE_SUPABASE_URL = "https://jdksnfkupzywjdfefkyj.supabase.co"
  }

[build.environment]
  NODE_VERSION = "18"
  PNPM_VERSION = "9.15.3"
  NETLIFY_USE_PNPM = "true"

# Handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Force HTTPS
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Handle www redirect
[[redirects]]
  from = "https://www.dhg-hub.org/*"
  to = "https://dhg-hub.org/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-lighthouse" 