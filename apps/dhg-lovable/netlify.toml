[build]
  base = "apps/dhg-lovable"
  command = "cd ../.. && pnpm install && cd apps/dhg-lovable && pnpm build:app"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--version"
  PNPM_VERSION = "9.15.3"

