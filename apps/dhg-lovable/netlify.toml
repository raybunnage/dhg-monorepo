[build]
  base = "apps/dhg-lovable"
  command = "cd ../.. && pnpm install && cd apps/dhg-lovable && pnpm build"
  publish = "dist"

[dev]
  # Use the same command that works locally
  command = "pnpm exec vite"
  targetPort = 5179
  port = 8888

[build.environment]
  NODE_VERSION = "18"
  PNPM_VERSION = "9.15.3"

# [[plugins]]
#   package = "@netlify/build-plugin-pnpm" 

[context.branch-deploy]
  command = "cd ../.. && pnpm install && cd apps/dhg-lovable && pnpm build" 